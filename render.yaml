services:
  - type: web
    name: aishopify-store
    env: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        value: 8812114263
      - key: ADMIN_PIN
        sync: false
      - key: ALFA_SBP_KEY
        sync: false
      - key: ALFA_SBP_ID
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
