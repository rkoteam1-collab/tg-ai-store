name: Check store reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: store-reminder-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake store and check due reminders
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 https://tg-ai-store.onrender.com/api/health
